[project]
name = "bangla-stt-bench"
version = "0.1.0"
description = "Compare speech-to-text providers on our own Bangla / English / mixed meeting audio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests>=2.32",
    "jiwer>=3.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
local = [
    "torch>=2.5",
    "transformers>=4.45",
    "accelerate>=1.0",
]

[tool.uv]
package = false
