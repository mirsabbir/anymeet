[project]
name = "transcriber"
version = "0.1.0"
description = "Meeting transcription for Bangla / English / mixed speech, with swappable providers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai>=2.33",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "huggingface_hub>=1.0",  # local model status and downloads, without torch
]

[project.optional-dependencies]
# Local Whisper models (local-whisper-*); large, so only installed when chosen.
local = [
    "torch>=2.5",
    "transformers>=4.45",
    "accelerate>=1.0",
]
# Speaker identification (pyannote community-1); large, so only installed when turned on.
speakers = [
    "torch>=2.5",
    "pyannote.audio>=4.0",
]
# Windows with an NVIDIA graphics card: PyTorch built for CUDA instead of PyPI's CPU-only
# build (about 2.6 GB). Passed together with `local` or `speakers` when the GPU is chosen.
cuda = [
    "torch>=2.5",
]
# Never passed by the apps; it only gives `conflicts` below its other side.
cpu = [
    "torch>=2.5",
]

[project.scripts]
transcribe = "transcriber.cli:main"

[tool.uv]
# Keeps two PyTorch builds for Windows in the lock: PyPI's unless `--extra cuda` is passed.
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
